---
# Globals for the neonvim Lua codebase.
# `any: true` means "this global exists; don't complain about any field/method
# access on it." This is the pragmatic choice — writing out the full vim API
# would be thousands of lines, and the plugin/utils modules have dynamic shape.
#
# Referenced by selene.toml via `std = "lua51+neonvim"`.
globals:
  # Neovim's built-in Lua API (vim.api, vim.fn, vim.opt, vim.g, vim.lsp, ...)
  vim:
    any: true

  # Set in init.lua as `_G.plugin = require("plugin")` — the plugin manager.
  plugin:
    any: true

  # Set in init.lua as `_G.utils = require("utils")` — shared helpers.
  utils:
    any: true

  # Set in lua/options.lua as `_G.get_fold_text = function() ... end`,
  # referenced by `vim.opt.foldtext = "v:lua.get_fold_text()"`.
  get_fold_text:
    any: true

  # LuaJIT global — Neovim uses LuaJIT, so `jit.os`, `jit.arch`, etc. are
  # always available despite not being part of the lua51 std.
  jit:
    any: true

  # LuaJIT's bitops module — `bit.band`, `bit.bor`, etc. Always available
  # in LuaJIT, used in utils.is_trusted_dir for stat mode bit checks.
  bit:
    any: true
