# Selene config for the neonvim Lua codebase.
# The std chain starts from lua51 (LuaJIT is 5.1-compatible) and adds
# neonvim.yml which whitelists the globals this config relies on.
std = "lua51+nvim"

[rules]
# _G.plugin / _G.utils / _G.get_fold_text are intentionally exposed as
# globals from init.lua and lua/options.lua for use across plugin/ files.
global_usage = "allow"

# which-key's keymap API uses mixed positional+named tables
# ({ "<leader>x", func, desc = "...", mode = { "n" } }). Can't change
# their shape; disabling the lint avoids 100+ false positives.
mixed_table = "allow"
