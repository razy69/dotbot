---
- shell:
    -
      command: git submodule update --init --recursive
      description: Installing submodules
- defaults:
    link:
      create: true
      relink: true
      relative: true
- create:
    - ~/bin
    - ~/notes
    - ~/.config
    - ~/.config/bat
    - ~/.config/delta/themes
    - ~/.vim
    - ~/.zsh/completions
- clean:
    ~/:
      force: true
- link:
    ~/.dir_colors:
      path: misc/dir_colors
    ~/.gitconfig:
      path: git/gitconfig
    ~/.gitignore:
      path: git/gitignore
    ~/.zshrc:
      path: zsh/zshrc
    ~/.zshenv:
      path: zsh/zshenv
    ~/.zsh/config:
      path: zsh/config
    ~/.zsh/plugins:
      path: zsh/plugins
    ~/.zsh/keymaps:
      path: zsh/keymaps
    ~/.tmux.conf:
      path: tmux/tmux.conf
    ~/.tmux.theme.conf:
      path: tmux/tmux.theme.conf
    ~/.tmux.dark.theme.conf:
      path: tmux/tmux.dark.theme.conf
    ~/.tmux.light.theme.conf:
      path: tmux/tmux.light.theme.conf
    ~/.tmux:
      path: tmux/tmux
    ~/.config/mise:
      path: mise
    ~/.config/nvim:
      path: nvim
    ~/.config/bat/config:
      path: bat/bat.conf
    ~/.config/bat/themes:
      path: bat/themes/catppuccin/themes
    ~/.config/delta/themes/catppuccin.gitconfig:
      path: delta/themes/catppuccin/catppuccin.gitconfig
    ~/.config/ghostty/config:
      path: ghostty/config
    ~/.config/ghostty/themes:
      path: ghostty/themes/catppuccin/themes
    ~/.config/k9s:
      path: k9s
    ~/.vim/colors:
      path: vim/colors
    ~/.vimrc:
      path: vim/vimrc
- shell:
    -
      command: '
        for bin in bat delta erd exa fd git tmux nvim rg zsh; do
          if ! command -v "$bin" &> /dev/null; then
            echo "\033[1;33mx $bin is not installed\033[0m";
          fi;
        done'
      description: Checking installed binaries
      stdout: true
    -
      command: chmod -R 755 ~/.zsh/completions
      description: Fix zsh compinit insecure directories
