---
- defaults:
    link:
      create: true
      relink: true
      relative: true
- create:
    - ~/bin
    - ~/.config
    - ~/.vim
    - ~/.zsh/completions
    - ~/notes
- clean:
    ~/:
      force: true
- link:
    ~/.dir_colors:
      path: misc/dir_colors
    ~/.gitconfig:
      path: git/gitconfig
    ~/.gitignore:
      path: git/gitignore
    ~/.zshrc:
      path: zsh/zshrc
    ~/.zshenv:
      path: zsh/zshenv
    ~/.zsh/config:
      path: zsh/config
    ~/.zsh/plugins:
      path: zsh/plugins
    ~/.zsh/keymaps:
      path: zsh/keymaps
    ~/.tmux.conf:
      path: tmux/tmux.conf
    ~/.tmux:
      path: tmux/tmux
    ~/.config/nvim:
      path: nvim
    ~/.config/bat/config:
      path: bat/bat.conf
    ~/.config/bat/themes:
      path: bat/themes/catppuccin/themes
    ~/.config/delta/themes/catppuccin.gitconfig:
      path: delta/themes/catppuccin/catppuccin.gitconfig
    ~/.config/ghostty/config:
      path: ghostty/config
    ~/.config/k9s/config.yaml:
      path: k9s/config.yaml
    ~/.config/k9s/skins:
      path: k9s/themes/catppuccin/dist
    ~/.vim/colors:
      path: vim/colors
    ~/.vimrc:
      path: vim/vimrc
- shell:
    -
      command: git submodule update --init --recursive
      description: Installing submodules
    -
      command: '
        for bin in bat catimg delta erd exa fd git tmux nvim rg zsh; do
          if ! command -v "$bin" &> /dev/null; then
            echo -e "\033[1;33mx $bin is not installed\033[0m";
          fi;
        done'
      description: Checking installed binaries
      stdout: true
    -
      command: '
        if ! command -v asdf &> /dev/null; then
          asdf_release="v0.16.4"
          asdf_tar="asdf.tar.gz"
          case $(uname -a) in
            Darwin*) osname="darwin" ;;
            Linux*)  osname="linux" ;;
            *)       osname="unknown" ;;
          esac
          case $(arch) in
            arm64)  archname="arm64" ;;
            x86_64) archname="amd64" ;;
            *)      archname="386" ;;
          esac
          curl -L "https://github.com/asdf-vm/asdf/releases/download/${asdf_release}/asdf-${asdf_release}-${osname}-${archname}.tar.gz" -o "${HOME}/bin/${asdf_tar}"
          tar -xvf "${HOME}/bin/${asdf_tar}" -C "${HOME}/bin/"
          rm -f "${HOME}/bin/${asdf_tar}"
        else
          echo -e "\033[1;32masdf is installed\033[0m";
        fi'
      description: Install ASDF
      stdout: true
    -
      command: ~/.tmux/plugins/tpm/bin/install_plugins
      description: Install tmux plugins
    -
      command: nvim --headless "+Lazy! sync" +qa
      description: Install nvim plugins
    -
      command: chmod -R 755 ~/.zsh/completions
      description: Fix zsh compinit insecure directories
