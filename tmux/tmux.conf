##
# Razy Tmux Settings
##

#
# Plugins
#

set-option -g @plugin "tmux-plugins/tmux-prefix-highlight"
set-option -g @plugin "tmux-plugins/tmux-resurrect"
set-option -g @plugin "tmux-plugins/tpm"


#
# Configuration
#

# Override prefix
unbind C-b
set-option -g prefix C-g
bind-key C-g send-prefix

set -g mouse on

%if #{>:#{version},2.2}
set -q -g status-utf8 on  # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on
%endif

# Focus events enabled for terminals that support them
set-option -g focus-events on

# Emacs key bindings in tmux command prompt (prefix + :) are better than vi keys, even for vim users
set-option -g status-keys emacs

# Enable 256 color
set-option -sa terminal-overrides ",*256col*:Tc"
set -g default-terminal "tmux-256color"

# Helps in faster key repetition
set-option -sg escape-time 0

# TPM
set-option -g repeat-time 0

# Start windows and panes at 1, not 0
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Limit scrollback buffer
set-option -g history-limit 10000

# Don"t rename windows automatically
set-option -g allow-rename on

# Terminal emulator window titles
set-option -g set-titles on

# Tmux messages are displayed for 4 seconds
set-option -g display-time 4000

# Window title string (uses statusbar variables)
set-option -g set-titles-string "#H [#I:#W]"

# Update status bar each second
set-option -g status-interval 10

# Set xterm input codes passed by tmux
set-window-option -g xterm-keys on

# Aggressive
set-window-option -g aggressive-resize on

# Preserves the contents of the window when an interactive application starts and restores it on exit
set-window-option -g alternate-screen on

# Monitor activities in other windows
set-option -g monitor-activity on
set-option -g visual-activity on
set-option -g activity-action none

set-option -g monitor-silence 0
set-option -g visual-silence off
set-option -g silence-action none

set-option -g monitor-bell on
set-option -g visual-bell on
set-option -g bell-action none

# Navigate between windows
bind-key -n S-Left previous-window
bind-key -n S-Right next-window

# Navigate between panes
bind-key -n C-Left select-pane -L
bind-key -n C-Right select-pane -R
bind-key -n C-Down select-pane -D
bind-key -n C-Up select-pane -U

# Split window horizontaly (legacy & 1.9+)
bind-key "|" split-window -h -c "#{pane_current_path}"

# Split window verticaly (legacy & 1.9+)
bind-key "-" split-window -v -c "#{pane_current_path}"

# Create new window
bind-key "c" new-window -c "#{pane_current_path}"

# Move current window to the left by one position
bind-key "=" swap-window -t -1

# Move current window to the right by one position
bind-key "+" swap-window -t +1

bind-key Enter copy-mode # enter copy mode

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi H send -X start-of-line
bind-key -T copy-mode-vi L send -X end-of-line


#
# Themes
#

BLUE="colour4"
BLACK="colour16"
LIGHT_GRAY="colour248"
GRAY="colour239"
DARK_GRAY="colour236"
DARK_WHITE="colour242"
WHITE="colour252"
RED="colour1"
GREEN="colour2"
YELLOW="colour3"
CYAN="colour6"

# Change primary_color in function of session name
set -g @primary_color $CYAN

# How to use, start new session isolated by different socket
#
# TMUX_ENV=ssh
# tmux -L $TMUX_ENV new-session -s $TMUX_ENV -c $PWD
#
if-shell '[ "$(tmux display-message -p "#S")" = "local" ]' \
  "set -g @primary_color $BLUE"

if-shell '[ "$(tmux display-message -p "#S")" = "dev" ]' \
  "set -g @primary_color $GREEN"

if-shell '[ "$(tmux display-message -p "#S")" = "preprod" ]' \
  "set -g @primary_color $YELLOW"

if-shell '[ "$(tmux display-message -p "#S")" = "prod" ]' \
  "set -g @primary_color $RED"

if-shell '[ "$(tmux display-message -p "#S")" = "remote" ]' \
  "set -g @primary_color $WHITE"

# Ugly hack to set colors in function of session's name (reload tmux conf using tmux hooks)
set-hook -g session-renamed 'run-shell "tmux source-file ~/.tmux.conf"'
set-hook -g after-new-session 'run-shell "tmux source-file ~/.tmux.conf"'

# Messaging
set-option -g message-style "fg=$WHITE,bg=$GRAY"

# Statusbar
set-option -g status-position top
set-option -g status-left-length 10
set-option -g status-right-length 100
set-option -g status-interval 0
set-option -g status-justify left
set-option -g status-style "fg=default,bg=$DARK_GRAY"
set-option -g status-left "#[fg=$BLACK,bg=#{@primary_color},nobold]  #[fg=#{@primary_color},bg=$DARK_GRAY,nobold]"
set-option -g status-right "#[fg=$GRAY,bg=$DARK_GRAY,nobold]#{prefix_highlight}#[fg=$LIGHT_GRAY,bg=$GRAY,nobold]  #(whoami)   #{=|15|...:#{host}} #[fg=#{@primary_color},bg=$GRAY,nobold]#[fg=$BLACK,bg=#{@primary_color},nobold]  #{=|15|...:#{session_name}} "

# Panes
set-option -g pane-border-style "fg=$DARK_WHITE,bg=default,dim"
set-option -g pane-active-border-style "fg=$WHITE,bg=default"

# Windows
set-option -g window-style "bg=default"
set-option -g window-active-style "bg=default"
set-option -g window-status-separator ""

#{?cond,true,false}
#{||:cond1,cond2} -> or
#{&&:cond1,cond2} -> and

# false (0) if no flag, true (1) if any flag
#{||:#{window_zoomed_flag},#{||:#{window_bell_flag},#{window_activity_flag}}}

set-option -g window-status-current-format "#[fg=$DARK_GRAY,bg=$LIGHT_GRAY,nobold]#[fg=$BLACK,bg=$LIGHT_GRAY,nobold] #I  #W #{?#{||:#{window_zoomed_flag},#{||:#{window_bell_flag},#{window_activity_flag}}},#{?window_zoomed_flag,  ,}#{?window_bell_flag, 󰂞 ,}#{?window_activity_flag, 󰈈 ,} ,}#[fg=$LIGHT_GRAY,bg=$DARK_GRAY,nobold]"
set-option -g window-status-format "#[fg=$DARK_GRAY,bg=$GRAY,nobold]#[fg=$LIGHT_GRAY,bg=$GRAY,nobold] #I  #W #{?#{||:#{window_zoomed_flag},#{||:#{window_bell_flag},#{window_activity_flag}}},#{?window_zoomed_flag,  ,}#{?window_bell_flag, 󰂞 ,}#{?window_activity_flag, 󰈈 ,} ,}#[fg=$GRAY,bg=$DARK_GRAY,nobold]"

# prefix_highlight
set -g @prefix_highlight_fg "#{@primary_color}"
set -g @prefix_highlight_bg $GRAY
set -g @prefix_highlight_prefix_prompt ""
set -g @prefix_highlight_empty_prompt "  "
set -g @prefix_highlight_empty_attr "fg=$LIGHT_GRAY,bg=$GRAY"
set -g @prefix_highlight_empty_has_affixes "off"
set -g @prefix_highlight_output_suffix ""


#
# TPM
#

run "~/.tmux/plugins/tpm/tpm"
